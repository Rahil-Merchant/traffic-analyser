<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Results Modal UI Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #111; color: white; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const ResultsModal = ({ isOpen, onClose, statistics, results, onRecalibrate, initialRoadWidth, initialRoadLength, canRecalibrate }) => {
      const [roadWidth, setRoadWidth] = useState(initialRoadWidth || '');
      const [roadLength, setRoadLength] = useState(initialRoadLength || '');
      const [isRecalibrating, setIsRecalibrating] = useState(false);

      if (!isOpen) return null;

      const formatTime = (seconds) => {
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hours > 0) return `${hours}h ${minutes}m ${secs}s`;
        if (minutes > 0) return `${minutes}m ${secs}s`;
        return `${secs}s`;
      };

      return (
        <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
          <div className="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 border border-gray-600/50 rounded-2xl shadow-2xl max-w-2xl w-full mx-4 overflow-hidden">
            {/* Header */}
            <div className="bg-gradient-to-r from-green-600/20 via-blue-600/20 to-green-600/20 p-6 border-b border-gray-700/50">
              <div className="flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="w-12 h-12 bg-gradient-to-br from-green-500 to-blue-600 rounded-xl flex items-center justify-center shadow-lg">
                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                  <div>
                    <h2 className="text-2xl font-bold text-white">Analysis Complete</h2>
                    <p className="text-green-400 text-sm">Processing finished successfully</p>
                  </div>
                </div>
                <button onClick={onClose} className="w-8 h-8 bg-gray-700/50 hover:bg-gray-600/50 rounded-lg flex items-center justify-center transition-colors duration-200">
                  <svg className="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
            </div>

            {/* Statistics */}
            {statistics && (
              <div className="p-6 border-b border-gray-700/30">
                <h3 className="text-lg font-semibold text-white mb-4 flex items-center space-x-2">
                  <svg className="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                  </svg>
                  <span>Processing Statistics</span>
                </h3>
                <div className="grid grid-cols-2 gap-4">
                  <div className="bg-gradient-to-br from-green-500/20 to-green-600/20 border border-green-500/30 rounded-xl p-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-green-400 text-sm font-medium">Valid Paths</p>
                        <p className="text-3xl font-bold text-white">{statistics.total_valid_paths}</p>
                      </div>
                    </div>
                  </div>
                  <div className="bg-gradient-to-br from-indigo-500/20 to-indigo-600/20 border border-indigo-500/30 rounded-xl p-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <p className="text-indigo-400 text-sm font-medium">Fleet Speed</p>
                        <p className="text-3xl font-bold text-white">{statistics.fleet_average_speed_kmh} km/h</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* Recalibration Section */}
            {canRecalibrate && onRecalibrate && (
              <div className="p-6 border-t border-gray-700/30 bg-gray-800/30">
                <h3 className="text-lg font-semibold text-white mb-4 flex items-center space-x-2">
                  <svg className="w-5 h-5 text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8v8M20 8v8M4 16l16-8M4 8l16 8" />
                  </svg>
                  <span>Speed Recalibration</span>
                </h3>
                <div className="flex items-end space-x-4">
                  <div className="flex-1">
                    <label className="block text-xs font-medium text-gray-400 mb-1">Road Width (m)</label>
                    <input type="number" value={roadWidth} onChange={e => setRoadWidth(e.target.value)} className="w-full bg-gray-900 border border-gray-600/50 rounded-lg p-2 text-white focus:ring-1 focus:ring-orange-500" />
                  </div>
                  <div className="flex-1">
                    <label className="block text-xs font-medium text-gray-400 mb-1">Road Length (m)</label>
                    <input type="number" value={roadLength} onChange={e => setRoadLength(e.target.value)} className="w-full bg-gray-900 border border-gray-600/50 rounded-lg p-2 text-white focus:ring-1 focus:ring-orange-500" />
                  </div>
                  <button 
                    onClick={async () => {
                      setIsRecalibrating(true);
                      await onRecalibrate(parseFloat(roadWidth), parseFloat(roadLength));
                      setIsRecalibrating(false);
                    }}
                    disabled={isRecalibrating || !roadWidth || !roadLength}
                    className="px-6 py-2 bg-gradient-to-r from-orange-600 to-orange-700 text-white font-semibold rounded-lg hover:from-orange-500 hover:to-orange-600 transition-all duration-200 shadow-lg disabled:opacity-50 flex items-center h-[42px]"
                  >
                    {isRecalibrating ? 'Working...' : 'Recalibrate'}
                  </button>
                </div>
                <p className="text-xs text-gray-500 mt-2">Update distance calibration to instantly recalculate speed metrics and reports.</p>
              </div>
            )}

            {/* Footer */}
            <div className="bg-gray-800/50 border-t border-gray-700/30 p-4 flex justify-end">
              <button onClick={onClose} className="px-6 py-2 bg-gradient-to-r from-blue-600 to-blue-700 text-white font-semibold rounded-lg hover:from-blue-500 shadow-lg">Continue</button>
            </div>
          </div>
        </div>
      );
    };

    const App = () => {
      const BASE_SPEED = 42.5;
      const BASE_LENGTH = 50.0;
      
      const [stats, setStats] = useState({
        total_valid_paths: 1420,
        fleet_average_speed_kmh: BASE_SPEED
      });

      const handleRecalibrate = (width, length) => {
        return new Promise(resolve => {
          setTimeout(() => {
            setStats(prev => ({
              ...prev,
              fleet_average_speed_kmh: (BASE_SPEED * (length / BASE_LENGTH)).toFixed(1)
            }));
            resolve();
          }, 1500);
        });
      };

      return (
        <div className="min-h-screen bg-gray-950 flex flex-col items-center justify-center">
          <button 
            className="px-6 py-3 bg-blue-600 text-white rounded-lg shadow-lg"
            onClick={() => document.getElementById('modal-trigger').click()}
          >
            Show Mock UI
          </button>
          
          {/* For automated testing via subagent */}
          <button id="modal-trigger" className="hidden" />

          <ResultsModal 
            isOpen={true} 
            onClose={() => alert('Closed')}
            statistics={stats}
            results={{ excel_path: "mock.xlsx" }}
            onRecalibrate={handleRecalibrate}
            initialRoadWidth={20}
            initialRoadLength={50}
            canRecalibrate={true}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
